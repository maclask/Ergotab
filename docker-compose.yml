# Docker-compose is a way to run multiple containers at once and connect them
# This sets up and runs postgres and the django dev server as services
# Reference: https://docs.docker.com/compose/compose-file/

# Initial setup with
# $ docker-compose -f docker-compose.yml up

# Can run management commands with
# $ docker-compose run web /code/manage.py whatever

version: '3'

services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=tabbycat
      - POSTGRES_USER=tabbycat
      - POSTGRES_DB=tabbycat
    volumes:
      # postgres:18+ images use a pg_ctlcluster-style, version-specific data
      # directory and refuse to start against a volume mounted directly at
      # .../data. Mount the parent directory instead so Postgres manages the
      # versioned subdirectory itself (also required for future pg_upgrade).
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:6
    volumes:
     - redis_data:/data

  web:
    build: .
    # Hack to wait until Postgres is up before running things
    command: ["./bin/docker-wait.sh", "--timeout=0", "db:5432", "--", "./bin/docker-run-honcho.sh"]
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    environment:
      - DEBUG=1
      - IN_DOCKER=1
      - DISABLE_SENTRY=1
      - DOCKER_REDIS=1
      - USING_NGINX=1
    ports:
      - "80:80"
    volumes:
      - ./tabbycat/settings:/tcd/tabbycat/settings
    working_dir: /tcd

  worker:
    build: .
    # Hack to wait until migration is done before running things
    command: ["./bin/docker-wait.sh", "--timeout=0", "web:80", "--", "./bin/docker-run-worker.sh"]
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - IN_DOCKER=1
      - DISABLE_SENTRY=1
      - DOCKER_REDIS=1
      - USING_NGINX=1
    working_dir: /tcd

volumes:
  pgdata:
  node_modules:
  redis_data:
